[project]
name = "techinsight-backend"
version = "1.0.0"
description = "TechInsight - AI-powered knowledge base API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
